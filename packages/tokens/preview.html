<!doctype html><html><head><meta charset="utf-8"><title>tokens preview</title>
<link rel="stylesheet" href="dist/tokens.css">
<style>
body{margin:0;font:var(--notsho-text-body-size)/var(--notsho-text-body-leading) var(--notsho-font-body);background:var(--notsho-color-surface);color:var(--notsho-color-text);padding:var(--notsho-space-section)}
h1{font:var(--notsho-text-heading-weight) var(--notsho-size-3xl)/var(--notsho-text-heading-leading) var(--notsho-font-heading);letter-spacing:var(--notsho-text-heading-tracking);margin:0 0 var(--notsho-space-stack)}
.row{display:flex;gap:var(--notsho-space-stack);flex-wrap:wrap;margin-top:var(--notsho-space-section)}
.card{background:var(--notsho-card-background);border:var(--notsho-border-width) solid var(--notsho-card-border);border-radius:var(--notsho-card-radius);padding:var(--notsho-card-padding);box-shadow:var(--notsho-card-shadow);flex:1;min-width:16rem}
.muted{color:var(--notsho-color-text-muted)}
button{height:var(--notsho-button-height);padding:0 var(--notsho-button-padding-x);border-radius:var(--notsho-button-radius);font:var(--notsho-button-weight) var(--notsho-size-sm) var(--notsho-font-body);border:0;cursor:pointer;transition:background var(--notsho-motion-duration-fast) var(--notsho-motion-easing-standard)}
.primary{background:var(--notsho-color-accent);color:var(--notsho-color-on-accent)}.primary:hover{background:var(--notsho-color-accent-hover)}
.danger{background:var(--notsho-color-danger);color:var(--notsho-color-on-danger)}
.ghost{background:var(--notsho-color-accent-subtle);color:var(--notsho-color-accent);border:1px solid var(--notsho-color-accent-border)}
input{height:var(--notsho-input-height);padding:0 var(--notsho-input-padding-x);border-radius:var(--notsho-input-radius);border:var(--notsho-border-width) solid var(--notsho-input-border);background:var(--notsho-input-background);color:inherit;font:inherit;width:100%;box-sizing:border-box}
.badge{display:inline-block;padding:2px 10px;border-radius:var(--notsho-badge-radius);font-weight:var(--notsho-badge-weight);font-size:var(--notsho-size-xs);background:var(--notsho-color-success-subtle);color:var(--notsho-color-success)}
.swatches{display:flex;gap:4px;margin-top:var(--notsho-space-stack)}.sw{flex:1;height:28px;border-radius:var(--notsho-radius-sm)}
</style></head><body>
<h1>Notsho tokens</h1>
<p class="muted">Every value on this page is a CSS variable. Nothing is hardcoded.</p>
<div class="swatches">
<div class="sw" style="background:var(--notsho-color-blue-100)"></div><div class="sw" style="background:var(--notsho-color-blue-300)"></div><div class="sw" style="background:var(--notsho-color-blue-500)"></div><div class="sw" style="background:var(--notsho-color-blue-700)"></div><div class="sw" style="background:var(--notsho-color-blue-900)"></div>
</div>
<div class="row">
<div class="card"><strong>Card</strong><p class="muted">Raised surface with border and shadow.</p><span class="badge">Active</span></div>
<div class="card"><label class="muted" style="font-size:var(--notsho-size-sm)">Email</label><input placeholder="you@example.com" style="margin-top:6px"><div style="display:flex;gap:8px;margin-top:12px"><button class="primary">Save</button><button class="ghost">Cancel</button><button class="danger">Delete</button></div></div>
</div>
</body></html>
